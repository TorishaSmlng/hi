<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Practice Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #24292f;
      background-color: #f6f8fa;
    }
    h1 {
      color: #0969da;
    }
    .card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 24px;
    }
    code {
      background: #eaeef2;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, GitHub! 👋</h1>
    <p>This is a simple HTML file for practicing with GitHub.</p>
    <p>Try editing this file, committing the change, and pushing it to a repository.</p>
    <p>Current status: <code>learning in progress</code></p>
  </div>
</body>
</html>
